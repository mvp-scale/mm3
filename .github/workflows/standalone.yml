# The standalone (one self-contained MM3 file per OS), built in GitHub from the exact source commit so its origin is provable.
# Runs on every merge to nightly (and by hand). It builds both files on one Linux runner (scripts/build-binary.ts writes the
# Node blob with a Linux Node, so it is the build host for both targets; it checks the pinned Node archive against the pin in
# the script AND the release's own SHASUMS256.txt), proves them (the smoke script on Linux and on a REAL Windows runner,
# `npm run parity`, `npm run parity:install`), writes SHA256SUMS, and, when MM3_PUBLISH is 'true', signs a build-provenance
# attestation for each file (`gh attestation verify <file> --repo <owner>/<repo>` proves which commit and workflow built it).
# The files stay as an artifact named standalone-<version>; `npm run release -- main` verifies the attestation and attaches
# them to the GitHub Release it creates (scripts/release.ts, promote). Nothing is published from here: no npm, no release.
# TODO(macOS arm64): scripts/build-binary.ts has no darwin target yet (no Mach-O injection, no ad-hoc re-sign), so there is no
# macOS job. When it does, add a macos-14 build+smoke job beside `windows` and list its file in `release-files`.
name: standalone

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # parity:install copies this image's git into its containers, which are Ubuntu 24.04 too
    outputs:
      version: ${{ steps.version.outputs.version }}
      linux_sha: ${{ steps.hash.outputs.linux }}
      win_sha: ${{ steps.hash.outputs.win }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm run build:binary -- --target linux-x64
      - run: npm run build:binary -- --target win-x64
      - name: The build is reproducible (two more builds from this commit give the same sha256 for both files)
        run: npm run check:binary-repro
      - name: The pinned Node archives match the release's own SHASUMS256.txt
        run: |
          cd dist-binary/cache
          grep -E " node-v[0-9.]+-(linux-x64\.tar\.xz|win-x64\.zip)$" SHASUMS256-*.txt | sed 's/^[^:]*://' | sha256sum -c -
      - name: Smoke test the Linux file with no Node on PATH
        run: sh scripts/smoke-standalone.sh "dist-binary/mm3-${{ steps.version.outputs.version }}-linux-x64"
      - run: npm run build
      - run: npm run parity   # the npm build and the standalone give the same answers
      - run: docker pull ubuntu:24.04
      - run: npm run parity:install   # two clean containers, no network: npm channel vs standalone channel, and the transition stages
      - id: hash
        run: |
          v=${{ steps.version.outputs.version }}
          echo "linux=$(sha256sum "dist-binary/mm3-$v-linux-x64" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "win=$(sha256sum "dist-binary/mm3-$v-win-x64.exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-build
          path: |
            dist-binary/mm3-${{ steps.version.outputs.version }}-linux-x64
            dist-binary/mm3-${{ steps.version.outputs.version }}-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: build
    runs-on: windows-latest   # the Windows file has only ever run under Wine; this is its first real run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-build
          path: built
      - name: Smoke test the Windows file with PATH cut down to System32
        shell: pwsh
        run: |
          ./scripts/smoke-standalone.ps1 -Bin "built/mm3-${{ needs.build.outputs.version }}-win-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  release-files:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # the attestation is signed with this run's identity
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-build
          path: standalone
      - name: The bytes are the ones the build job hashed and the smoke tests ran
        run: |
          cd standalone
          v=${{ needs.build.outputs.version }}
          printf '%s  %s\n' "${{ needs.build.outputs.linux_sha }}" "mm3-$v-linux-x64" "${{ needs.build.outputs.win_sha }}" "mm3-$v-win-x64.exe" | sha256sum -c -
      - name: SHA256SUMS
        run: cd standalone && sha256sum mm3-* | LC_ALL=C sort -k2 > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance (signed only when publishing is switched on)
        if: vars.MM3_PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            standalone/mm3-*
            standalone/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-${{ needs.build.outputs.version }}
          path: standalone/
          if-no-files-found: error
          retention-days: 90   # a release picks these up later, from the nightly build of the same commit
