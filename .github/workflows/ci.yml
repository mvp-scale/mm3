name: ci

on:
  push:
    branches: [nightly]
  pull_request:
    branches: [nightly]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high   # a known high or critical vulnerability in any dependency fails CI
      - run: sh scripts/check-clean.sh --all
      - run: npm run typecheck
      - run: npm run check:node-floor   # src compiles against the Node 22 types, the oldest we support
      - run: npm test
      - run: npm run build
      - run: npx tsx scripts/check-readme.ts
      - run: npm run check:pack
      - run: npm run check:plugin
      - run: npm run check:launcher   # launcher/checksums.json is there and names package.json's version
