# The small Windows launcher workflow, for bringing up a Windows-specific change before it goes to the big matrix (standalone.yml). Run by hand
# (workflow_dispatch) from a throwaway branch: it builds the win-x64 file itself on Linux (job build) and, in job launcher, runs the four launcher cases
# on windows-2025 under real Claude Code, with the launcher-form manifests (launcher/manifests/). It uses nothing from any other workflow.
# Rule and reasons: launcher/README.md, "Bringing up a Windows change". INFORMATIONAL: it gates nothing. The cases do not wait for each other.
name: launcher-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:binary -- --target win-x64
      - id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-win-x64
          path: dist-binary/mm3-${{ steps.version.outputs.version }}-win-x64.exe
          if-no-files-found: error
          retention-days: 1
    outputs:
      version: ${{ steps.version.outputs.version }}

  launcher:
    name: launcher win-x64 (${{ matrix.case }})
    needs: build   # consumes the file built above
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        case: [cmd-default, cmd-space, sh-visible, powershell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-win-x64
          path: built
      - name: Install Claude Code (Anthropic's documented native installer for Windows)
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.local\bin\claude.exe" --version
      - name: "Plugin launcher under real Claude Code, no Node: ${{ matrix.case }}"
        shell: pwsh
        run: |
          ./scripts/smoke-launcher.ps1 -Bin "built/mm3-${{ needs.build.outputs.version }}-win-x64.exe" -Case ${{ matrix.case }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
