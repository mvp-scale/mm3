# Nightly (dispatched by `npm run release -- nightly`, builds the `nightly` branch as the plain x.y.z) and release (tag vX.Y.Z on `main`) publishing, in one
# workflow because npm trusted publishing names a single workflow file. Nothing publishes unless the repo
# variable MM3_PUBLISH is 'true'. Releases to main are not automated yet: the tag trigger stays off until
# nightly has been tested in the wild; a release runs only by hand (workflow_dispatch on a v*.*.* tag).
name: publish

on:
  # no schedule: a nightly is a formal version, released with `npm run release -- nightly`, not a daily build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      go: ${{ steps.plan.outputs.go }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'nightly' }}
          fetch-depth: 0
      - id: plan
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="v$(node -p "require('./package.json').version")"
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main; releases ship from main only"
              exit 1
            fi
            { echo "channel=release"; echo "ref=$GITHUB_REF"; echo "go=true"; } >> "$GITHUB_OUTPUT"
          else
            go=false
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -n "$(git log --since='24 hours ago' --format=%H -1)" ]; then
              go=true
            else
              echo "no commits on nightly in the last 24 hours; skipping"
            fi
            { echo "channel=nightly"; echo "ref=$(git rev-parse HEAD)"; echo "go=$go"; } >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: plan
    # a release is a clean copy of a nightly that already passed CI and the ceremony: main holds no tests, so only nightly runs them here
    if: needs.plan.outputs.go == 'true' && needs.plan.outputs.channel == 'nightly'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}

  publish:
    needs: [plan, ci]
    if: always() && needs.plan.outputs.go == 'true' && vars.MM3_PUBLISH == 'true' && (needs.ci.result == 'success' || needs.plan.outputs.channel == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - name: Nightly version is the plain number
        if: needs.plan.outputs.channel == 'nightly'
        run: |
          base=$(node -p "require('./package.json').version")
          # a formal nightly is exactly package.json's x.y.z, with nothing attached: npm takes a version once, so a version that is already out has to be bumped in a PR
          if npm view "@mvpscale/mm3@$base" version >/dev/null 2>&1; then
            echo "::error::$base is already on npm; bump the version in package.json and release.json to release again"
            exit 1
          fi
          echo "publishing $base"
      - name: Publish nightly
        if: needs.plan.outputs.channel == 'nightly'
        run: npm publish --tag nightly
      - name: Publish release
        if: needs.plan.outputs.channel == 'release'
        run: npm publish --tag latest
      - name: GitHub release
        if: needs.plan.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
