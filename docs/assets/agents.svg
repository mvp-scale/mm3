  <title id="t">Where MM3 installs</title>
  <desc id="d">MM3 installs in a coding agent with two steps: plugin marketplace add mvp-scale/mm3, then plugin install mm3@mvp-scale. An agent without a plugin store registers mm3 mcp as an MCP server instead. Tested, installed and registered through each agent's own commands: Claude Code, Codex, GitHub Copilot, Factory Droid, Gemini CLI, Goose, OpenCode, Amp, Cursor. Expected to work, following the same open standards but not installed by us yet: Aider, Hermes, Cline, Kilo Code, Pi, OpenClaw, Kiro, Antigravity, any agent that reads AGENTS.md. The exact command for each agent is at mm3lab.dev/agents.</desc>
