  <text class="h" x="28" y="52">Install it in your agent</text>
  <text class="sub" x="28" y="80">Add the marketplace, install the plugin. No plugin store? Register <tspan class="mono2">mm3 mcp</tspan> as a server.</text>
  <rect class="code" x="28" y="96" width="844" height="68" rx="10"/>
  <text class="mono" x="46" y="126"><tspan class="dim">1  </tspan>plugin marketplace add mvp-scale/mm3</text>
  <text class="mono" x="46" y="154"><tspan class="dim">2  </tspan>plugin install mm3@mvp-scale</text>
